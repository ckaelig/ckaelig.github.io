name: Site checks
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validator regression tests
        run: python3 tools/test_check_site.py
      - name: Validate site (links, i18n, privacy, security, size)
        run: python3 tools/check_site.py
